<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Spinbox</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spinbox" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="shortcut icon" href="/icons/icon-192.png" />
  <script src="/config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --surface2:  #1e1e1e;
      --border:    #2c2c2c;
      --accent:    #ffffff;
      --accent-dim: rgba(255,255,255,0.15);
      --text:      #f0f0f0;
      --muted:     #666;
      --muted2:    #444;
      --radius:    10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--border);
    }
    #header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 2rem;
      letter-spacing: 1px;
      color: var(--accent);
      text-transform: lowercase;
    }
    #header .server-info {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: lowercase;
    }

    #search-icon-btn, #signout-btn {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      color: var(--muted);
      transition: background .15s, opacity .15s;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
      opacity: 0.6;
    }
    #search-icon-btn:active, #search-icon-btn.active,
    #signout-btn:active { background: var(--surface2); opacity: 1; }

    /* ── Screens ── */
    .screen { display: none; flex-direction: column; height: 100%; }
    .screen.active { display: flex; }

    /* ── Login Screen ── */
    #login-screen {
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }
    #login-screen h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 3rem;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: lowercase;
      margin-bottom: 8px;
    }
    .field { width: 100%; max-width: 360px; }
    .field label {
      display: block;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 2px;
      text-transform: lowercase;
    }
    .field input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 14px 16px;
      font-size: 1rem;
      font-family: 'Barlow', sans-serif;
      outline: none;
      transition: border-color .2s;
    }
    .field input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      max-width: 360px;
      padding: 16px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 1.4rem;
      letter-spacing: 3px;
      text-transform: lowercase;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.85; transform: scale(0.98); }
    .btn.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    #login-error { color: #ff5555; font-size: 0.85rem; min-height: 1.2em; font-style: italic; }

    /* ── Main Screen ── */
    #main-screen { overflow: hidden; }

    /* tab bar */
    #tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      gap: 0;
      flex-shrink: 0;
    }
    .tab {
      padding: 12px 18px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: lowercase;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active { color: var(--accent); border-color: var(--accent); }

    /* content panes */
    #content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .pane {
      display: none;
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
    }
    .pane.active { display: block; }

    /* ── Search overlay ── */
    #search-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      flex-direction: column;
      padding: 16px;
    }
    #search-overlay.active { display: flex; }
    #search-overlay-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    #search-overlay-bar input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 12px 16px;
      font-size: 1rem;
      font-family: 'Barlow', sans-serif;
      outline: none;
    }
    #search-overlay-bar input:focus { border-color: var(--accent); }
    #search-overlay-bar button {
      padding: 12px 20px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: lowercase;
      cursor: pointer;
    }
    #search-close-btn {
      padding: 12px 16px;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      cursor: pointer;
      font-family: 'Barlow', sans-serif;
    }
    #search-overlay-results {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Artists pane with letter index ── */
    #pane-artists { display: none; padding: 0; }
    #pane-artists.active { display: flex; }
    #artists-inner {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      padding-right: 48px;
    }

    /* letter index rail */
    #letter-rail {
      width: 36px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      gap: 1px;
      background: var(--bg);
      border-left: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100%;
      overflow: hidden;
    }
    .letter-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--muted2);
      border-radius: 5px;
      cursor: pointer;
      transition: background .1s, color .1s;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .letter-btn.has-artists { color: var(--text); }
    .letter-btn:active { background: var(--accent); color: #000; }
    .letter-btn.active-letter { background: var(--accent); color: #000; }

    /* letter section headers inside artist grid */
    .letter-anchor {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 1.6rem;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: lowercase;
      padding: 16px 0 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .letter-anchor:first-child { padding-top: 0; }

    /* grid of cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:active { transform: scale(0.96); }
    .card:hover { border-color: rgba(255,255,255,0.4); }

    .card-art {
      width: 100%;
      aspect-ratio: 1;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      overflow: hidden;
    }
    .card-art img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 10px 12px 12px; }
    .card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: lowercase;
    }
    .card-sub {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    /* track list */
    .track-list { display: flex; flex-direction: column; gap: 2px; }
    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .track-row:active, .track-row.playing { background: var(--surface); }
    .track-row.playing .track-name { color: var(--accent); }
    .track-num { width: 24px; text-align: center; font-size: 0.8rem; color: var(--muted); flex-shrink: 0; }
    .track-name {
      flex: 1;
      font-size: 0.9rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .track-duration { font-size: 0.8rem; color: var(--muted); flex-shrink: 0; }

    /* section labels */
    .section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: lowercase;
      margin-bottom: 10px;
    }

    /* ── Now Playing Bar ── */
    #now-playing {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      min-height: 76px;
      position: relative;
    }
    #np-art {
      width: 48px; height: 48px;
      border-radius: 6px;
      background: var(--surface2);
      overflow: hidden;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    #np-art img { width: 100%; height: 100%; object-fit: cover; }
    #np-info { flex: 1; min-width: 0; }
    #np-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 0.5px;
      text-transform: lowercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #np-artist { font-size: 0.78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    #np-progress-wrap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--border);
      cursor: pointer;
    }
    #np-progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width .5s linear; }

    #np-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .ctrl-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      color: var(--muted);
      transition: background .12s, color .12s;
      -webkit-tap-highlight-color: transparent;
      font-size: 1rem;
    }
    .ctrl-btn:active { background: var(--surface2); color: var(--accent); }
    .ctrl-btn.play-btn {
      background: var(--accent);
      color: #000;
      width: 48px; height: 48px;
      font-size: 1.1rem;
    }
    .ctrl-btn.play-btn:active { opacity: 0.8; }

    #volume-wrap { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; }
    #volume-wrap input[type=range] {
      width: 64px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* loading / empty states */
    .state-msg {
      text-align: center;
      color: var(--muted);
      padding: 48px 0;
      font-size: 0.9rem;
      font-style: italic;
    }
    .spinner {
      display: inline-block;
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: lowercase;
      color: var(--muted);
      cursor: pointer;
      padding: 8px 0 16px;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s;
    }
    .back-btn:active { color: var(--accent); }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .queue-item.current { background: var(--surface2); }
    .queue-item.current .queue-item-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 0.5px;
      text-transform: lowercase;
      color: var(--accent);
    }
    .queue-item-num { color: var(--muted2); width: 20px; text-align: center; flex-shrink: 0; font-size: 0.8rem; }
    .queue-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-item-artist { color: var(--muted); font-size: 0.75rem; }

    /* album detail header */
    .album-page {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .album-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 0;
      flex: 1;
      min-height: 0;
    }
    .album-art-col {
      flex-shrink: 0;
      width: min(40%, 280px);
    }
    .album-art-col .album-header-art {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface2);
      margin-bottom: 12px;
    }
    .album-art-col .album-header-art img { width: 100%; height: 100%; object-fit: cover; }
    .album-tracks-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      max-height: 100%;
    }
    .album-header-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 1.6rem;
      letter-spacing: 1px;
      text-transform: lowercase;
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .album-header-meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
    /* genre pills */
    .genre-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 4px 0 20px;
    }
    .genre-pill {
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 24px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: lowercase;
      color: var(--text);
      cursor: pointer;
      transition: background .12s, border-color .12s, color .12s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .genre-pill:active, .genre-pill.active-genre {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }
    .genre-pill .genre-count {
      font-size: 0.75rem;
      opacity: 0.6;
      margin-left: 4px;
    }

    /* Last.fm bio / info */
    .lastfm-bio {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 20px;
      padding: 14px 16px;
      background: var(--surface);
      border-left: 2px solid var(--border);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .lastfm-bio a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border); }
    .lastfm-info {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.6;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .lastfm-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: lowercase;
      color: var(--muted2);
      margin-bottom: 4px;
    }

    .album-artist-link {
      color: var(--text);
      cursor: pointer;
      border-bottom: 1px solid var(--muted2);
      transition: color .15s, border-color .15s;
    }
    .album-artist-link:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>

<div id="app">
  <div id="header">
    <h1 id="app-logo" style="border:2px solid #fff;padding:2px 10px;line-height:1;display:inline-block;">spinbox</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="server-info" id="server-label"></span>
      <div id="search-icon-btn" title="Search" style="display:none">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="7.5" cy="7.5" r="5.5" stroke="white" stroke-width="1.8"/>
          <line x1="11.7" y1="11.7" x2="16" y2="16" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="signout-btn" title="Sign out" style="display:none">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 3H3C2.45 3 2 3.45 2 4V14C2 14.55 2.45 15 3 15H7" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="16" y1="9" x2="7" y2="9" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <polyline points="12.5,5.5 16,9 12.5,12.5" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="login-screen" class="screen active">
    <div class="field">
      <label>Jukebox Name</label>
      <input id="inp-name" type="text" placeholder="spinbox" autocomplete="off" spellcheck="false" />
    </div>
    <div class="field">
      <label>Server URL</label>
      <input id="inp-server" type="url" placeholder="http://nas:4533" autocomplete="off" spellcheck="false" />
    </div>
    <div class="field">
      <label>Username</label>
      <input id="inp-user" type="text" autocomplete="username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input id="inp-pass" type="password" autocomplete="current-password" />
    </div>
    <div id="login-error"></div>
    <button class="btn" id="login-btn">Connect</button>
  </div>

  <!-- MAIN -->
  <div id="main-screen" class="screen">
    <div id="tabs">
      <div class="tab active" data-pane="artists">Artists</div>
      <div class="tab" data-pane="albums">Albums</div>
      <div class="tab" data-pane="recent">Recent</div>
      <div class="tab" data-pane="random">Random</div>
      <div class="tab" data-pane="favorites">Favorites</div>
      <div class="tab" data-pane="genres">Genres</div>
      <div class="tab" data-pane="queue">Queue</div>
    </div>

    <div id="content">
      <!-- Search overlay -->
      <div id="search-overlay">
        <div id="search-overlay-bar">
          <input id="search-input" type="search" placeholder="Artist, album, song…" />
          <button id="search-go">Go</button>
          <button id="search-close-btn">✕</button>
        </div>
        <div id="search-overlay-results"></div>
      </div>

      <!-- Artists -->
      <div class="pane active" id="pane-artists">
        <div id="artists-inner">
          <div class="state-msg"><div class="spinner"></div></div>
        </div>
        <div id="letter-rail"></div>
      </div>

      <!-- Albums -->
      <div class="pane" id="pane-albums">
        <div class="state-msg"><div class="spinner"></div></div>
      </div>

      <!-- Recently Added -->
      <div class="pane" id="pane-recent">
        <div class="state-msg"><div class="spinner"></div></div>
      </div>

      <!-- Random -->
      <div class="pane" id="pane-random">
        <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
          <button class="btn" id="random-refresh-btn" style="width:auto;padding:8px 20px;font-size:1rem">&#8635; reshuffle</button>
        </div>
        <div id="random-grid" class="state-msg"><div class="spinner"></div></div>
      </div>


      <!-- Favorites -->
      <div class="pane" id="pane-favorites">
        <div class="state-msg"><div class="spinner"></div></div>
      </div>

      <!-- Genres -->
      <div class="pane" id="pane-genres">
        <div class="state-msg"><div class="spinner"></div></div>
      </div>

      <!-- Queue -->
      <div class="pane" id="pane-queue">
        <div id="queue-header" style="display:none;justify-content:space-between;align-items:center;margin-bottom:14px;flex-shrink:0">
          <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-style:italic;font-size:1.1rem;letter-spacing:1px;text-transform:lowercase;color:var(--muted)">up next</span>
          <button id="clear-queue-btn" style="background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:0.9rem;letter-spacing:1px;text-transform:lowercase;cursor:pointer">clear all</button>
        </div>
        <div id="queue-list" class="track-list"></div>
      </div>
    </div>
  </div>

  <!-- NOW PLAYING BAR -->
  <div id="now-playing" style="display:none">
    <div id="np-progress-wrap"><div id="np-progress-bar"></div></div>
    <div id="np-art">♪</div>
    <div id="np-info">
      <div id="np-title">—</div>
      <div id="np-artist">—</div>
    </div>
    <div id="np-controls">
      <div class="ctrl-btn" id="btn-prev">&#9664;&#9664;</div>
      <div class="ctrl-btn play-btn" id="btn-play">&#9654;</div>
      <div class="ctrl-btn" id="btn-next">&#9654;&#9654;</div>
    </div>
    <div id="volume-wrap">
      🔊<input type="range" id="volume" min="0" max="1" step="0.02" value="0.8">
    </div>
  </div>
</div>

<audio id="player"></audio>

<script>
// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let cfg = { server: '', user: '', pass: '' };
let queue = [];
let queueIdx = -1;
const player = document.getElementById('player');

// ─────────────────────────────────────────────
//  Subsonic API helpers
// ─────────────────────────────────────────────
function apiParams(extra = {}) {
  const salt = Math.random().toString(36).slice(2);
  const token = md5(cfg.pass + salt);
  return new URLSearchParams({
    u: cfg.user, t: token, s: salt,
    v: '1.16.1', c: 'spinbox', f: 'json',
    ...extra
  });
}

async function api(method, extra = {}) {
  const url = `${cfg.server}/rest/${method}?${apiParams(extra)}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  const res = data['subsonic-response'];
  if (res.status !== 'ok') throw new Error(res.error?.message || 'API error');
  return res;
}

function streamUrl(id) { return `${cfg.server}/rest/stream?${apiParams({ id, maxBitRate: 0 })}`; }
function coverUrl(id)  { return `${cfg.server}/rest/getCoverArt?${apiParams({ id, size: 300 })}`; }

// ─────────────────────────────────────────────
//  Login
// ─────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', async () => {
  const server = document.getElementById('inp-server').value.trim().replace(/\/$/, '');
  const user   = document.getElementById('inp-user').value.trim();
  const pass   = document.getElementById('inp-pass').value;
  const name   = document.getElementById('inp-name').value.trim() || 'spinbox';
  const errEl  = document.getElementById('login-error');
  errEl.textContent = '';
  if (!server || !user || !pass) { errEl.textContent = 'All fields required.'; return; }
  cfg = { server, user, pass, name };
  try {
    await api('ping');
    localStorage.setItem('spinbox_cfg', JSON.stringify(cfg));
    enterMain();
  } catch(e) {
    errEl.textContent = 'Connection failed: ' + e.message;
  }
});

function enterMain() {
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('main-screen').classList.add('active');
  document.getElementById('server-label').textContent = new URL(cfg.server).hostname;
  document.getElementById('app-logo').textContent = cfg.name || 'spinbox';
  document.getElementById('search-icon-btn').style.display = 'flex';
  document.getElementById('signout-btn').style.display = 'flex';
  loadArtists();
  loadAlbums();
  loadRecent();
  loadRandom();
  loadFavorites();
  loadGenres();
}

function signOut() {
  // Clear saved credentials
  localStorage.removeItem('spinbox_cfg');
  cfg = { server: '', user: '', pass: '', name: '' };

  // Stop playback
  player.pause();
  player.src = '';
  queue = [];
  queueIdx = -1;

  // Hide now playing bar
  document.getElementById('now-playing').style.display = 'none';
  document.getElementById('np-title').textContent = '—';
  document.getElementById('np-artist').textContent = '—';
  document.getElementById('np-art').innerHTML = '♪';
  document.getElementById('np-progress-bar').style.width = '0%';

  // Hide search/signout icons
  document.getElementById('search-icon-btn').style.display = 'none';
  document.getElementById('signout-btn').style.display = 'none';
  document.getElementById('search-overlay').classList.remove('active');

  // Reset logo
  document.getElementById('app-logo').textContent = 'spinbox';
  document.getElementById('server-label').textContent = '';

  // Reset tabs to default
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('[data-pane="artists"]').classList.add('active');
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-artists').classList.add('active');

  // Switch screens
  document.getElementById('main-screen').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
}

document.getElementById('signout-btn').addEventListener('click', signOut);

(function() {
  try {
    const saved = localStorage.getItem('spinbox_cfg');
    if (saved) {
      cfg = JSON.parse(saved);
      document.getElementById('inp-server').value = cfg.server;
      document.getElementById('inp-user').value   = cfg.user;
      document.getElementById('inp-pass').value   = cfg.pass;
      document.getElementById('inp-name').value   = cfg.name || '';
      api('ping').then(() => enterMain()).catch(() => {});
    }
  } catch(e) {}
})();

// ─────────────────────────────────────────────
//  Tabs
// ─────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('pane-' + tab.dataset.pane).classList.add('active');
    // wire reshuffle btn each time random tab is activated
    if (tab.dataset.pane === 'random') {
      const btn = document.getElementById('random-refresh-btn');
      if (btn) { btn.onclick = loadRandom; }
    }
    if (tab.dataset.pane === 'favorites') {
      loadFavorites();
    }
    if (tab.dataset.pane === 'genres') {
      loadGenres();
    }
  });
});

// ─────────────────────────────────────────────
//  Search overlay
// ─────────────────────────────────────────────
const searchOverlay = document.getElementById('search-overlay');

document.getElementById('search-icon-btn').addEventListener('click', () => {
  searchOverlay.classList.add('active');
  document.getElementById('search-icon-btn').classList.add('active');
  setTimeout(() => document.getElementById('search-input').focus(), 100);
});

document.getElementById('search-close-btn').addEventListener('click', () => {
  searchOverlay.classList.remove('active');
  document.getElementById('search-icon-btn').classList.remove('active');
});

document.getElementById('search-go').addEventListener('click', doSearch);
document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

async function doSearch() {
  const q   = document.getElementById('search-input').value.trim();
  const out = document.getElementById('search-overlay-results');
  if (!q) return;
  out.innerHTML = '<div class="state-msg"><div class="spinner"></div></div>';
  try {
    const res     = await api('search3', { query: q, artistCount: 10, albumCount: 10, songCount: 20 });
    const r       = res.searchResult3 || {};
    const artists = r.artist || [];
    const albums  = r.album  || [];
    const songs   = r.song   || [];
    let html = '';

    // Artists first
    if (artists.length) {
      html += `<div class="section-label">artists</div>`;
      html += `<div class="grid" style="margin-bottom:20px">${artists.map(a => `
        <div class="card artist-result" data-id="${a.id}" data-name="${esc(a.name)}">
          <div class="card-art">${a.coverArt ? `<img src="${coverUrl(a.coverArt)}" loading="lazy" onerror="this.style.display='none'">` : '🎤'}</div>
          <div class="card-info"><div class="card-title">${esc(a.name)}</div></div>
        </div>`).join('')}</div>`;
    }

    // Albums second
    if (albums.length) {
      html += `<div class="section-label">albums</div>`;
      html += `<div class="grid" style="margin-bottom:20px">${albums.map(a => albumCard(a)).join('')}</div>`;
    }

    // Songs third
    if (songs.length) {
      html += `<div class="section-label">songs</div>`;
      html += `<div class="track-list">${songs.map((s, i) => trackRow(s, i)).join('')}</div>`;
    }

    if (!html) html = '<div class="state-msg">no results.</div>';
    out.innerHTML = html;
    const songArr = songs;

    // Artist cards → navigate to artist page
    out.querySelectorAll('.artist-result').forEach(card => {
      card.addEventListener('click', () => {
        searchOverlay.classList.remove('active');
        document.getElementById('search-icon-btn').classList.remove('active');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        document.querySelector('[data-pane="artists"]').classList.add('active');
        document.getElementById('pane-artists').classList.add('active');
        openArtist(card.dataset.id, card.dataset.name, loadArtists);
      });
    });

    // Album cards → navigate to album page
    out.querySelectorAll('.card:not(.artist-result)').forEach(card => {
      card.addEventListener('click', () => {
        searchOverlay.classList.remove('active');
        document.getElementById('search-icon-btn').classList.remove('active');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        document.querySelector('[data-pane="albums"]').classList.add('active');
        document.getElementById('pane-albums').classList.add('active');
        openAlbumInPane(document.getElementById('pane-albums'), card.dataset.id, card.dataset.name, loadAlbums);
      });
    });

    out.querySelectorAll('[data-action="play"]').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); playTracks(songArr, parseInt(btn.dataset.idx)); });
    });
    out.querySelectorAll('[data-action="queue"]').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); addToQueue(songArr, parseInt(btn.dataset.idx)); });
    });
  } catch(e) {
    out.innerHTML = `<div class="state-msg">Error: ${e.message}</div>`;
  }
}

// ─────────────────────────────────────────────
//  Artists with letter index
// ─────────────────────────────────────────────
async function loadArtists() {
  const inner = document.getElementById('artists-inner');
  const rail  = document.getElementById('letter-rail');
  try {
    const res     = await api('getArtists');
    const indices = res.artists?.index || [];

    if (!indices.length) {
      inner.innerHTML = '<div class="state-msg">No artists found.</div>';
      rail.innerHTML  = '';
      return;
    }

    const letterMap = {};
    indices.forEach(idx => { letterMap[idx.name.toUpperCase()] = idx.artist || []; });

    let html = '';
    Object.entries(letterMap).forEach(([letter, artists]) => {
      html += `<div class="letter-anchor" id="artist-letter-${letter}">${letter}</div>`;
      html += `<div class="grid">${artists.map(a => `
        <div class="card" data-id="${a.id}" data-name="${esc(a.name)}">
          <div class="card-art">${a.coverArt ? `<img src="${coverUrl(a.coverArt)}" loading="lazy" onerror="this.style.display='none'">` : '🎤'}</div>
          <div class="card-info"><div class="card-title">${esc(a.name)}</div></div>
        </div>`).join('')}</div>`;
    });
    inner.innerHTML = html;
    inner.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openArtist(card.dataset.id, card.dataset.name));
    });

    const allLetters      = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
    const availableLetters = new Set(Object.keys(letterMap));
    rail.innerHTML = allLetters.map(l => `
      <div class="letter-btn ${availableLetters.has(l) ? 'has-artists' : ''}" data-letter="${l}">${l}</div>
    `).join('');

    rail.querySelectorAll('.letter-btn.has-artists').forEach(btn => {
      btn.addEventListener('click', () => {
        const anchor = document.getElementById(`artist-letter-${btn.dataset.letter}`);
        if (anchor) {
          anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
          rail.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active-letter'));
          btn.classList.add('active-letter');
          setTimeout(() => btn.classList.remove('active-letter'), 600);
        }
      });
    });

    rail.addEventListener('touchmove', e => {
      e.preventDefault();
      const touch = e.touches[0];
      const el    = document.elementFromPoint(touch.clientX, touch.clientY);
      if (el && el.classList.contains('letter-btn') && el.classList.contains('has-artists')) el.click();
    }, { passive: false });

  } catch(e) {
    inner.innerHTML = `<div class="state-msg">Error: ${e.message}</div>`;
  }
}

async function openArtist(id, name, backFn) {
  const inner  = document.getElementById('artists-inner');
  const rail   = document.getElementById('letter-rail');
  const goBack = backFn || loadArtists;
  inner.innerHTML = `<div class="back-btn" id="back-artists">&#8592; artists</div><div class="state-msg"><div class="spinner"></div></div>`;
  rail.innerHTML  = '';
  document.getElementById('back-artists').addEventListener('click', goBack);
  try {
    const res    = await api('getArtist', { id });
    const albums = res.artist?.album || [];
    inner.innerHTML = `
      <div class="back-btn" id="back-artists">&#8592; artists</div>
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap">
        <div class="album-header-title">${esc(name)}</div>
        <button class="btn secondary" id="star-artist-btn" style="width:auto;padding:8px 18px;font-size:1rem;flex-shrink:0">☆ favorite</button>
      </div>
      <div id="lastfm-artist-bio"></div>
      <div class="grid">${albums.map(a => albumCard(a)).join('')}</div>`;
    document.getElementById('back-artists').addEventListener('click', goBack);
    document.getElementById('star-artist-btn').addEventListener('click', () => starArtist(id, document.getElementById('star-artist-btn')));
    inner.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openAlbumInArtists(card.dataset.id, card.dataset.name, () => openArtist(id, name, backFn)));
    });
    // Async Last.fm bio injection
    lastfmArtistBio(name).then(bio => {
      const el = document.getElementById('lastfm-artist-bio');
      if (el && bio) el.innerHTML = renderLastfmBio(bio);
    });
  } catch(e) {
    inner.innerHTML = `<div class="back-btn" id="back-artists">&#8592; artists</div><div class="state-msg">Error: ${e.message}</div>`;
    document.getElementById('back-artists').addEventListener('click', goBack);
  }
}

async function openAlbumInArtists(id, name, backFn) {
  const inner = document.getElementById('artists-inner');
  inner.innerHTML = `<div class="back-btn" id="back-pane">&#8592; Back</div><div class="state-msg"><div class="spinner"></div></div>`;
  document.getElementById('back-pane').addEventListener('click', backFn);
  try {
    const res   = await api('getAlbum', { id });
    const album = res.album;
    const songs = album.song || [];
    inner.innerHTML = `
      <div class="album-page">
        <div class="back-btn" id="back-pane">&#8592; back</div>
        <div class="album-layout">
          <div class="album-art-col">
            <div class="album-header-art">${album.coverArt ? `<img src="${coverUrl(album.coverArt)}">` : '💿'}</div>
            <button class="btn" id="play-all-btn" style="width:100%;padding:10px 0;font-size:1.1rem;margin-bottom:8px">▶ play all</button>
            <button class="btn secondary" id="queue-all-btn" style="width:100%;padding:10px 0;font-size:1.1rem;margin-bottom:8px">+ queue all</button>
            <button class="btn secondary" id="star-album-btn" style="width:100%;padding:10px 0;font-size:1.1rem">☆ add to favorites</button>
          </div>
          <div class="album-tracks-col">
            <div class="album-header-title">${esc(album.name)}</div>
            <div class="album-header-meta"><span class="album-artist-link" id="artist-link">${esc(album.artist || '')}</span> · ${songs.length} tracks</div>
            <div id="lastfm-album-info"></div>
            <div class="track-list">${songs.map((s, i) => trackRow(s, i)).join('')}</div>
          </div>
        </div>
      </div>`;
    document.getElementById('back-pane').addEventListener('click', backFn);
    document.getElementById('play-all-btn').addEventListener('click', () => playTracks(songs, 0));
    document.getElementById('queue-all-btn').addEventListener('click', () => addAllToQueue(songs));
    document.getElementById('star-album-btn').addEventListener('click', () => starAlbum(album.id, document.getElementById('star-album-btn')));
    document.getElementById('artist-link').addEventListener('click', () => {
      if (album.artistId) openArtist(album.artistId, album.artist, loadArtists);
    });
    lastfmAlbumInfo(album.artist, album.name).then(info => {
      const el = document.getElementById('lastfm-album-info');
      if (el && info) el.innerHTML = renderLastfmAlbumInfo(info);
    });
    inner.querySelectorAll('[data-action="play"]').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); playTracks(songs, parseInt(btn.dataset.idx)); });
    });
    inner.querySelectorAll('[data-action="queue"]').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); addToQueue(songs, parseInt(btn.dataset.idx)); });
    });
  } catch(e) {
    inner.innerHTML = `<div class="back-btn" id="back-pane">&#8592; Back</div><div class="state-msg">Error: ${e.message}</div>`;
    document.getElementById('back-pane').addEventListener('click', backFn);
  }
}

// ─────────────────────────────────────────────
//  Recently Added
// ─────────────────────────────────────────────
async function loadRecent() {
  const pane = document.getElementById('pane-recent');
  try {
    const res    = await api('getAlbumList2', { type: 'newest', size: 50 });
    const albums = res.albumList2?.album || [];
    if (!albums.length) { pane.innerHTML = '<div class="state-msg">no recently added albums.</div>'; return; }
    pane.innerHTML = `<div class="grid">${albums.map(a => albumCard(a)).join('')}</div>`;
    pane.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openAlbumInPane(pane, card.dataset.id, card.dataset.name, loadRecent));
    });
  } catch(e) {
    pane.innerHTML = `<div class="state-msg">Error: ${e.message}</div>`;
  }
}

// ─────────────────────────────────────────────
//  Random Albums
// ─────────────────────────────────────────────
async function loadRandom() {
  const grid = document.getElementById('random-grid');
  grid.innerHTML = '<div class="state-msg"><div class="spinner"></div></div>';
  try {
    const res    = await api('getAlbumList2', { type: 'random', size: 30 });
    const albums = res.albumList2?.album || [];
    if (!albums.length) { grid.innerHTML = '<div class="state-msg">no albums found.</div>'; return; }
    grid.className = 'grid';
    grid.innerHTML = albums.map(a => albumCard(a)).join('');
    const randomPane = document.getElementById('pane-random');
    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openAlbumInPane(randomPane, card.dataset.id, card.dataset.name, loadRandom));
    });
  } catch(e) {
    grid.innerHTML = `<div class="state-msg">Error: ${e.message}</div>`;
  }
}

// ─────────────────────────────────────────────
//  Last.fm integration
// ─────────────────────────────────────────────
function lastfmKey() {
  return (window.SPINBOX_CONFIG && window.SPINBOX_CONFIG.lastfmApiKey) || '';
}

async function lastfmArtistBio(artistName) {
  const key = lastfmKey();
  if (!key) return null;
  try {
    const url = `https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=${encodeURIComponent(artistName)}&api_key=${key}&format=json`;
    const r   = await fetch(url);
    const d   = await r.json();
    const bio = d?.artist?.bio?.summary;
    if (!bio) return null;
    // Strip the Last.fm "Read more on Last.fm" link appended to every bio
    return bio.replace(/<a href="https:\/\/www\.last\.fm[^"]*">[^<]*<\/a>\./gi, '').trim();
  } catch(e) { return null; }
}

async function lastfmAlbumInfo(artistName, albumName) {
  const key = lastfmKey();
  if (!key) return null;
  try {
    const url = `https://ws.audioscrobbler.com/2.0/?method=album.getinfo&artist=${encodeURIComponent(artistName)}&album=${encodeURIComponent(albumName)}&api_key=${key}&format=json`;
    const r   = await fetch(url);
    const d   = await r.json();
    const album = d?.album;
    if (!album) return null;
    return {
      wiki:      album.wiki?.summary?.replace(/<a href="https:\/\/www\.last\.fm[^"]*">[^<]*<\/a>\./gi, '').trim() || null,
      listeners: album.listeners ? parseInt(album.listeners).toLocaleString() : null,
      playcount: album.playcount ? parseInt(album.playcount).toLocaleString() : null,
      tags:      (album.tags?.tag || []).map(t => t.name).slice(0, 5)
    };
  } catch(e) { return null; }
}

function renderLastfmBio(bio) {
  if (!bio) return '';
  return `<div class="lastfm-bio">${bio}</div>`;
}

function renderLastfmAlbumInfo(info) {
  if (!info) return '';
  let parts = [];
  if (info.listeners) parts.push(`<div><div class="lastfm-label">listeners</div>${info.listeners}</div>`);
  if (info.playcount)  parts.push(`<div><div class="lastfm-label">plays</div>${info.playcount}</div>`);
  if (info.tags?.length) parts.push(`<div><div class="lastfm-label">tags</div>${info.tags.join(' · ')}</div>`);
  const statsHtml = parts.length ? `<div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:${info.wiki ? '10px' : '0'}">${parts.join('')}</div>` : '';
  const wikiHtml  = info.wiki ? `<div>${info.wiki}</div>` : '';
  if (!statsHtml && !wikiHtml) return '';
  return `<div class="lastfm-info">${statsHtml}${wikiHtml}</div>`;
}

async function loadFavorites() {

  try {
    const res     = await api('getStarred2');
    const starred = res.starred2 || {};
    const artists = starred.artist || [];
    const albums  = starred.album  || [];
    const songs   = starred.song   || [];

    let html = '';

    if (artists.length) {
      html += `<div class="section-label">artists</div>`;
      html += `<div class="grid" style="margin-bottom:20px">${artists.map(a => `
        <div class="card fav-artist-card" data-id="${a.id}" data-name="${esc(a.name)}">
          <div class="card-art">${a.coverArt ? `<img src="${coverUrl(a.coverArt)}" loading="lazy" onerror="this.style.display='none'">` : '🎤'}</div>

        </div>`).join('')}</div>`;

      html += `<div class="track-list">${songs.map((s, i) => trackRow(s, i)).join('')}</div>`;
    }

    if (!html) html = '<div class="state-msg">no favorites yet.<br><br><span style="font-size:0.8rem;color:var(--muted2)">star artists, albums, or songs in navidrome to see them here.</span></div>';
    pane.innerHTML = html;

    const songArr = songs;

    // Artist cards → artist page
    pane.querySelectorAll('.fav-artist-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        document.querySelector('[data-pane="artists"]').classList.add('active');
        document.getElementById('pane-artists').classList.add('active');
        openArtist(card.dataset.id, card.dataset.name, () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
          document.querySelector('[data-pane="favorites"]').classList.add('active');
          document.getElementById('pane-favorites').classList.add('active');
          loadFavorites();
        });
      });
    });

    // Album cards → album page within favorites pane
    pane.querySelectorAll('.card:not(.fav-artist-card)').forEach(card => {
      card.addEventListener('click', () => openAlbumInPane(pane, card.dataset.id, card.dataset.name, loadFavorites));
    });

    // Song play/queue buttons
    pane.querySelectorAll('[data-action="play"]').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); playTracks(songArr, parseInt(btn.dataset.idx)); });
    });
    pane.querySelectorAll('[data-action="queue"]').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); addToQueue(songArr, parseInt(btn.dataset.idx)); });
    });

  } catch(e) {
    pane.innerHTML = `<div class="state-msg">Error: ${e.message}</div>`;
  }
}

// ─────────────────────────────────────────────
//  Playback
// ─────────────────────────────────────────────
function playTracks(tracks, startIdx) {
  queue    = tracks;
  queueIdx = startIdx;
  playAt(queueIdx);
  renderQueue();
}

function playAt(idx) {
  const track = queue[idx];
  if (!track) return;
  queueIdx   = idx;
  player.src = streamUrl(track.id);
  player.volume = parseFloat(document.getElementById('volume').value);
  player.play().catch(() => {});
  updateNowPlaying(track);
  renderQueue();
}

function updateNowPlaying(track) {
  document.getElementById('now-playing').style.display = 'flex';
  document.getElementById('np-title').textContent  = track.title || track.name || '—';
  document.getElementById('np-artist').textContent = track.artist || '—';
  const artEl = document.getElementById('np-art');
  artEl.innerHTML = track.coverArt
    ? `<img src="${coverUrl(track.coverArt)}" onerror="this.style.display='none'">`
    : '♪';
  document.getElementById('btn-play').innerHTML = '⏸';
  document.title = `${track.title || '—'} · Spinbox`;
}

player.addEventListener('ended', () => {
  if (queueIdx < queue.length - 1) playAt(queueIdx + 1);
  else { document.getElementById('btn-play').innerHTML = '▶'; document.title = 'Spinbox'; }
});

player.addEventListener('timeupdate', () => {
  if (!player.duration) return;
  document.getElementById('np-progress-bar').style.width = (player.currentTime / player.duration * 100) + '%';
});

document.getElementById('np-progress-wrap').addEventListener('click', e => {
  if (!player.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  player.currentTime = ((e.clientX - rect.left) / rect.width) * player.duration;
});

document.getElementById('btn-play').addEventListener('click', () => {
  if (player.paused) { player.play(); document.getElementById('btn-play').innerHTML = '⏸'; }
  else               { player.pause(); document.getElementById('btn-play').innerHTML = '▶'; }
});
document.getElementById('btn-prev').addEventListener('click', () => {
  if (player.currentTime > 3) { player.currentTime = 0; return; }
  if (queueIdx > 0) playAt(queueIdx - 1);
});
document.getElementById('btn-next').addEventListener('click', () => {
  if (queueIdx < queue.length - 1) playAt(queueIdx + 1);
});
document.getElementById('volume').addEventListener('input', e => {
  player.volume = parseFloat(e.target.value);
});

// ─────────────────────────────────────────────
//  Queue pane
// ─────────────────────────────────────────────
function addToQueue(tracks, idx) {
  const track = tracks[idx];
  if (!track) return;
  queue.push(track);
  // if nothing playing, start immediately
  if (queueIdx === -1) {
    queueIdx = queue.length - 1;
    playAt(queueIdx);
  }
  renderQueue();
  flashQueueTab();
}

function addAllToQueue(tracks) {
  if (!tracks.length) return;
  const wasEmpty = queue.length === 0;
  queue.push(...tracks);
  if (wasEmpty || queueIdx === -1) {
    queueIdx = 0;
    playAt(queueIdx);
  }
  renderQueue();
  flashQueueTab();
}

function flashQueueTab() {
  const tab = document.querySelector('[data-pane="queue"]');
  if (!tab) return;
  tab.style.color = 'var(--accent)';
  setTimeout(() => { tab.style.color = ''; }, 600);
}

function removeFromQueue(idx) {
  if (idx < queueIdx) queueIdx--;
  else if (idx === queueIdx) {
    queue.splice(idx, 1);
    if (queue.length === 0) {
      queueIdx = -1;
      player.pause();
      player.src = '';
      document.getElementById('btn-play').innerHTML = '▶';
      document.title = 'Spinbox';
    } else {
      queueIdx = Math.min(queueIdx, queue.length - 1);
      playAt(queueIdx);
    }
    renderQueue();
    return;
  }
  queue.splice(idx, 1);
  renderQueue();
}

function clearQueue() {
  queue = [];
  queueIdx = -1;
  player.pause();
  player.src = '';
  document.getElementById('btn-play').innerHTML = '▶';
  document.getElementById('now-playing').style.display = 'none';
  document.title = 'Spinbox';
  renderQueue();
}

function renderQueue() {
  const el     = document.getElementById('queue-list');
  const header = document.getElementById('queue-header');
  if (!queue.length) {
    el.innerHTML = '<div class="state-msg">queue is empty.</div>';
    if (header) header.style.display = 'none';
    return;
  }
  if (header) header.style.display = 'flex';
  el.innerHTML = queue.map((t, i) => `
    <div class="queue-item ${i === queueIdx ? 'current' : ''}" data-idx="${i}">
      <div class="queue-item-num" style="cursor:pointer" data-play="${i}">${i === queueIdx ? '▶' : i + 1}</div>
      <div style="flex:1;min-width:0;cursor:pointer" data-play="${i}">
        <div class="queue-item-name">${esc(t.title || t.name || '—')}</div>
        <div class="queue-item-artist">${esc(t.artist || '')}</div>
      </div>
      <div class="queue-remove-btn" data-remove="${i}" title="remove">✕</div>
    </div>`).join('');

  el.querySelectorAll('[data-play]').forEach(el => {
    el.addEventListener('click', () => playAt(parseInt(el.dataset.play)));
  });
  el.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); removeFromQueue(parseInt(btn.dataset.remove)); });
  });

  // wire clear-all btn
  const clearBtn = document.getElementById('clear-queue-btn');
  if (clearBtn) clearBtn.onclick = clearQueue;
}

// ─────────────────────────────────────────────
//  Helpers
// ─────────────────────────────────────────────
function trackRow(s, i) {
  const dur = s.duration ? `${Math.floor(s.duration/60)}:${String(s.duration%60).padStart(2,'0')}` : '';
  return `<div class="track-row" data-idx="${i}">
    <div class="track-num">${i + 1}</div>
    <div class="track-name">${esc(s.title || s.name || '—')}</div>
    <div class="track-actions">
      <button class="track-action-btn track-action-play" data-action="play" data-idx="${i}">play</button>
      <button class="track-action-btn track-action-queue" data-action="queue" data-idx="${i}">+ queue</button>
    </div>
  </div>`;
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────
//  MD5 for Subsonic token auth
// ─────────────────────────────────────────────
function md5(str) {
  function safeAdd(x, y) { var lsw=(x&0xffff)+(y&0xffff); return ((x>>16)+(y>>16)+(lsw>>16)<<16)|(lsw&0xffff); }
  function bitRotateLeft(num, cnt) { return (num<<cnt)|(num>>>(32-cnt)); }
  function md5cmn(q,a,b,x,s,t) { return safeAdd(bitRotateLeft(safeAdd(safeAdd(a,q),safeAdd(x,t)),s),b); }
  function md5ff(a,b,c,d,x,s,t) { return md5cmn((b&c)|(~b&d),a,b,x,s,t); }
  function md5gg(a,b,c,d,x,s,t) { return md5cmn((b&d)|(c&~d),a,b,x,s,t); }
  function md5hh(a,b,c,d,x,s,t) { return md5cmn(b^c^d,a,b,x,s,t); }
  function md5ii(a,b,c,d,x,s,t) { return md5cmn(c^(b|~d),a,b,x,s,t); }
  var bArr=[];
  for(var i=0;i<str.length*8;i+=8){bArr[i>>5]|=(str.charCodeAt(i/8)&0xff)<<i%32;}
  bArr[str.length*8>>5]|=0x80<<str.length*8%32;
  bArr[(((str.length*8+64)>>>9)<<4)+14]=str.length*8;
  var a=1732584193,b=-271733879,c=-1732584194,d=271733878;
  for(var i=0;i<bArr.length;i+=16){
    var oa=a,ob=b,oc=c,od=d;
    a=md5ff(a,b,c,d,bArr[i],7,-680876936);       d=md5ff(d,a,b,c,bArr[i+1],12,-389564586);
    c=md5ff(c,d,a,b,bArr[i+2],17,606105819);     b=md5ff(b,c,d,a,bArr[i+3],22,-1044525330);
    a=md5ff(a,b,c,d,bArr[i+4],7,-176418897);     d=md5ff(d,a,b,c,bArr[i+5],12,1200080426);
    c=md5ff(c,d,a,b,bArr[i+6],17,-1473231341);   b=md5ff(b,c,d,a,bArr[i+7],22,-45705983);
